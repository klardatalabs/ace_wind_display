# Builds the image on GitHub, pushes it to GitHub Container Registry, then deploys it to the
# Contabo server: the compose file, the load balancer config and the backup script are
# copied to /opt/weston-wind (no clone on the server), the image is pulled and the stack is
# updated in place. Migrations run first, and the deploy fails if the site isn't healthy
# afterwards.
#
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, VITE_CESIUM_ION_TOKEN,
#          VITE_GOOGLE_MAP_TILES_API_KEY (optional).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_CESIUM_ION_TOKEN=${{ secrets.VITE_CESIUM_ION_TOKEN }}
            VITE_GOOGLE_MAP_TILES_API_KEY=${{ secrets.VITE_GOOGLE_MAP_TILES_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: |
          ssh -i ~/.ssh/deploy root@${{ secrets.DEPLOY_HOST }} 'mkdir -p /opt/weston-wind/deploy/lb /opt/weston-wind/scripts'
          scp -i ~/.ssh/deploy compose.yaml root@${{ secrets.DEPLOY_HOST }}:/opt/weston-wind/compose.yaml
          scp -i ~/.ssh/deploy deploy/lb/nginx.conf root@${{ secrets.DEPLOY_HOST }}:/opt/weston-wind/deploy/lb/nginx.conf
          scp -i ~/.ssh/deploy scripts/db-backup.sh root@${{ secrets.DEPLOY_HOST }}:/opt/weston-wind/scripts/db-backup.sh
      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy root@${{ secrets.DEPLOY_HOST }} \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='${{ github.actor }}' IMAGE_TAG='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/weston-wind
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export IMAGE_TAG
          docker compose pull --quiet
          docker logout ghcr.io
          # migrate runs first (api and collector wait for it to finish successfully)
          docker compose up -d --remove-orphans
          echo "$IMAGE_TAG" > DEPLOYED_COMMIT
          docker image prune -f --filter "until=168h" > /dev/null
          REMOTE
      - name: Check the site
        run: |
          for i in $(seq 1 60); do
            if ssh -i ~/.ssh/deploy root@${{ secrets.DEPLOY_HOST }} 'curl -fsS http://127.0.0.1:4100/api/health/ready'; then exit 0; fi
            sleep 5
          done
          exit 1
