# Tests on every pull request and push: backend unit and integration tests against real
# TimescaleDB and Redis service containers, and the frontend build and tests.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ace_wind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ace -d ace_wind"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ace
      PGPASSWORD: ci-password
      PGDATABASE: ace_wind
      REDIS_URL: redis://127.0.0.1:6379
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The timescaledb-ha image restarts Postgres once after first-time setup.
      - name: Migrate (retrying while the database settles)
        run: for i in 1 2 3 4 5 6; do npm run -s db:migrate && exit 0; sleep 5; done; exit 1
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Frontend tests
        working-directory: frontend/src
        run: node --test "three/*.test.mjs" "cesium/*.test.mjs"
