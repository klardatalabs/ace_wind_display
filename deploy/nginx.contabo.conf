# Host nginx on the Contabo server: TLS for the public site, then everything goes to the
# stack's load balancer on 127.0.0.1:4100 (compose service "lb"), which spreads requests
# and WebSockets across the api replicas.

server {
    listen 80;
    server_name we-do-wind.89-117-57-40.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/we-do-wind-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name we-do-wind.89-117-57-40.sslip.io;
    ssl_certificate /etc/letsencrypt/live/we-do-wind.89-117-57-40.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/we-do-wind.89-117-57-40.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /ws {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
