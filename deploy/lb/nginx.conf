# Load balancer in front of the api instances (compose service "lb").
#
#   visitor -> host nginx (TLS) -> this load balancer -> api replicas
#
# - Every api replica is found through Docker's DNS and re-resolved every 10 s, so
#   "docker compose up --scale api=N" needs no config change.
# - A replica that fails is taken out of rotation for 10 s; idempotent requests that hit a
#   failing replica are retried on another one.
# - First layer of rate limiting (per visitor IP); the app applies finer limits per chat
#   session, screen and email address.
# - gzip, and a cache for the fingerprinted static assets.

worker_processes auto;
events { worker_connections 8192; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 60s;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # The real visitor address, as sent by the host proxy. Only private hops are trusted.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"upstream":"$upstream_addr","cache":"$upstream_cache_status"}';
  access_log /dev/stdout json;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  limit_req_zone  $binary_remote_addr zone=api:20m       rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=chat:10m      rate=2r/s;
  limit_req_zone  $binary_remote_addr zone=downloads:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=sockets:10m;
  limit_req_status  429;
  limit_conn_status 429;

  proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:20m max_size=1g inactive=30d use_temp_path=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml application/wasm;

  upstream api {
    zone api_upstream 64k;
    least_conn;
    server api:4100 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /lb/health { access_log off; return 200 "ok\n"; }

    location = /ws {
      limit_conn sockets 30;
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location = /api/chat/stream {
      limit_req zone=chat burst=10 nodelay;
      proxy_pass http://api;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location /api/datasets/ {
      limit_req zone=downloads burst=5 nodelay;
      proxy_pass http://api;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
    }

    location /assets/ {
      proxy_pass http://api;
      proxy_cache assets;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Cache $upstream_cache_status;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
    }
  }
}
