services:
  timescaledb:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f}
    container_name: ace_timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${PGUSER:-ace_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-ace_wind}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init_timescaledb.sql:/docker-entrypoint-initdb.d/init_timescaledb.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ace_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  app:
    profiles: [app]
    build:
      context: .
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_GOOGLE_MAP_TILES_API_KEY: ${VITE_GOOGLE_MAP_TILES_API_KEY:-}
        VITE_SITE_LAT: ${VITE_SITE_LAT:-}
        VITE_SITE_LON: ${VITE_SITE_LON:-}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4100
      PGHOST: timescaledb
      PGPORT: 5432
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      ZENODO_DIR: /data/zenodo
      HISTORY_OPERATIONS_DIR: /data/operations
      HISTORY_PYTHON: /opt/history-python/bin/python
      HISTORY_BACKEND: ${HISTORY_BACKEND:-legacy}
    ports: ["127.0.0.1:4100:4100"]
    volumes: ["./data:/data"]

  grafana:
    profiles: [history]
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      PGDATABASE: ${PGDATABASE:-ace_wind}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  backup:
    profiles: [backup]
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f}
    restart: unless-stopped
    entrypoint: [sh, /scripts/history-backup.sh]
    command: [loop]
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: ${PGUSER:-ace_user}
      PGDATABASE: ${PGDATABASE:-ace_wind}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      BACKUP_COPY_OFFHOST: ${BACKUP_COPY_OFFHOST:-0}
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data
      - history_backups:/backups
      - ${BACKUP_OFFHOST_PATH:-./data/offhost}:/offhost

volumes:
  timescaledb_data:
  redis_data:
  grafana_data:
  history_backups:
